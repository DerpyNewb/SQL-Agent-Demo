<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SQL Query Agent — Yohann Gayao</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  p.sub { color: #555; margin-top: -0.5rem; }
  textarea { width: 100%; box-sizing: border-box; padding: 0.6rem; font-size: 1rem; }
  button { margin-top: 0.5rem; padding: 0.5rem 1.2rem; font-size: 1rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: 0.8rem; overflow-x: auto; white-space: pre-wrap; }
  table { border-collapse: collapse; margin-top: 0.5rem; }
  td, th { border: 1px solid #ccc; padding: 0.3rem 0.6rem; font-size: 0.9rem; }
  #answer { margin-top: 1rem; font-size: 1.05rem; }
  #error { color: #b00020; margin-top: 1rem; }
</style>
</head>
<body>
  <h1>SQL Query Agent</h1>
  <p class="sub">Ask a question about a small demo sales dataset (products + orders). Claude writes and runs the SQL live.</p>

  <textarea id="question" rows="2" placeholder="e.g. Which product category made the most revenue in Q1?"></textarea>
  <br />
  <button id="ask">Ask</button>

  <div id="error"></div>
  <div id="answer"></div>
  <pre id="sql" style="display:none"></pre>
  <div id="rows"></div>

<script>
  // Replace with your deployed Worker URL after `wrangler deploy`, e.g.
  // "https://sql-agent-demo.<your-subdomain>.workers.dev/run"
  const WORKER_URL = "https://REPLACE-ME.workers.dev/run";

  const $ = (id) => document.getElementById(id);

  $('ask').addEventListener('click', async () => {
    const question = $('question').value.trim();
    if (!question) return;

    $('error').textContent = '';
    $('answer').textContent = 'Thinking…';
    $('sql').style.display = 'none';
    $('rows').innerHTML = '';

    try {
      const resp = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `Request failed (${resp.status})`);

      $('answer').textContent = data.answer;

      if (data.sql) {
        $('sql').style.display = 'block';
        $('sql').textContent = data.sql;
      }

      if (Array.isArray(data.rows) && data.rows.length) {
        const cols = Object.keys(data.rows[0]);
        const head = '<tr>' + cols.map((c) => `<th>${c}</th>`).join('') + '</tr>';
        const body = data.rows
          .map((r) => '<tr>' + cols.map((c) => `<td>${r[c]}</td>`).join('') + '</tr>')
          .join('');
        $('rows').innerHTML = `<table>${head}${body}</table>`;
      }
    } catch (e) {
      $('answer').textContent = '';
      $('error').textContent = e.message;
    }
  });
</script>
</body>
</html>
